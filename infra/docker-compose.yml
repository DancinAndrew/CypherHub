# ============================================================
# 開發環境專用 docker-compose（Development Only）
# 生產環境請直接使用 Dockerfile（gunicorn，無 --debug）
# ============================================================
services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../backend/.env
    working_dir: /app
    # 開發模式：覆蓋 Dockerfile 的 gunicorn CMD，使用 flask dev server + hot reload
    command: flask --app app run --host=0.0.0.0 --port=8000 --debug
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    env_file:
      - ../frontend/.env
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
